name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true
env:
  NDK_VERSION: 28.2.13676358
# Every desktop OS runs the same suite on its own machine, and Android cross-checks run in parallel:
#   1. clippy and the unit tests (cargo test), natively (plus Android arm64 clippy + armv7 check);
#   2. `veylo-dx --self-test --online`: the shipped files, the store, off-thread display & autoplay,
#      the Picks model, libmpv/FFmpeg playing a real H.264/AAC clip, TLS and the update channel;
#   3. Windows and macOS: package the app as a release would, install it with the real installer
#      (install.ps1, install.sh) and self-test the installed copy;
#   4. a launch check: the app runs for a while without exiting or panicking (failing fast on crash),
#      and a screenshot of it is kept with the run (Artifacts: screenshots-<os>);
#   5. the picture test: six colour bars play, and the screenshot must show them in order (what the
#      OS really composes, not just "the window drew something"; crates/picture-check). Required
#      on Windows and macOS; on Linux it only reports (software GL leaves the GL area black there).
# `--workspace` also covers the app's own crates: crates/video-surface and crates/picture-check.
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked -- --test-threads=2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify release and CI tooling scripts
        run: |
          sh -n install.sh
          bash -n tools/release.sh tools/build-linux.sh tools/build-macos.sh tools/ci/launch-check.sh apps/veylo-dx/android/fetch-mpv.sh install.sh
          python3 -m unittest discover -s tools/picks-ai -p 'test_*.py' -v

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/veylo-dx
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/veylo-dx -> target
          shared-key: ci-android
      - uses: actions/cache@v4
        with:
          path: apps/veylo-dx/picks-ai/downloads
          key: picks-ai-downloads-${{ hashFiles('tools/picks-ai/pins.json') }}
      - uses: actions/cache@v4
        with:
          path: apps/veylo-dx/android/mpv
          key: android-mpv-${{ hashFiles('apps/veylo-dx/android/fetch-mpv.sh') }}
      - name: Android NDK and assets
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          bin="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
            echo "CC_armv7_linux_androideabi=$bin/armv7a-linux-androideabi24-clang"
            echo "AR_armv7_linux_androideabi=$bin/llvm-ar"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$bin/armv7a-linux-androideabi24-clang"
          } >> "$GITHUB_ENV"
          ./android/fetch-mpv.sh
          python3 ../../tools/picks-ai/fetch.py android-arm64 android-armv7
      - name: Clippy (Android arm64)
        run: cargo clippy --locked --target aarch64-linux-android -- -D warnings
      - name: Check (Android TV armv7)
        run: cargo check --locked --target armv7-linux-androideabi

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/veylo-dx
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libmpv-dev xvfb x11-utils imagemagick
        working-directory: .
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/veylo-dx -> target
      # Inference assets are pinned in pins.json; fetch.py verifies their SHA-256 checksums.
      - uses: actions/cache@v4
        with:
          path: apps/veylo-dx/picks-ai/downloads
          key: picks-ai-downloads-${{ hashFiles('tools/picks-ai/pins.json') }}
      - run: python3 ../../tools/picks-ai/fetch.py linux-x64
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked
      - name: Self-test
        run: ./target/debug/veylo-dx --self-test --online
      - name: Package and install Linux bundle (as release.yml does)
        working-directory: .
        run: |
          tools/build-linux.sh
          VEYLO_TARBALL=dist/veylo-linux-x64.tar.gz VEYLO_NO_LAUNCH=1 sh install.sh
      - name: Self-test the installed copy
        run: "$HOME/.local/bin/veylo" --self-test --online
      # The runner has no desktop portal: GTK waits 25 s for it before the window opens.
      - name: Launch check
        run: xvfb-run -a -s "-screen 0 1440x900x24" ../../tools/ci/launch-check.sh target/debug/veylo-dx ../../screenshots/linux-home.png 60
      # Report only: on the runner's software GL the GL area leaves the whole window black.
      - name: Picture test, colour bars on screen
        continue-on-error: true
        run: xvfb-run -a -s "-screen 0 1440x900x24" ../../tools/ci/launch-check.sh target/debug/veylo-dx ../../screenshots/linux-bars.png 60 --bars
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux
          path: screenshots/
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: apps/veylo-dx
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/veylo-dx -> target
      - uses: actions/cache@v4
        with:
          path: apps/veylo-dx/picks-ai/downloads
          key: picks-ai-downloads-${{ hashFiles('tools/picks-ai/pins.json') }}
      - uses: actions/cache@v4
        with:
          path: apps/veylo-dx/windows/mpv
          key: windows-mpv-${{ hashFiles('apps/veylo-dx/windows/fetch-mpv.ps1') }}
      - name: Fetch libmpv and the Picks assets
        run: |
          powershell -ExecutionPolicy Bypass -File windows/fetch-mpv.ps1
          python ../../tools/picks-ai/fetch.py windows-x64
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # crates/video-surface's tests (path order, fallback memory) run on Linux: on its own it doesn't
      # link this OS's libmpv, which only the app's build script finds. Clippy still checks it here.
      - run: cargo test --locked --workspace --exclude veylo-video-surface
      - run: cargo build --locked --release
      - name: Package (as tools/release.sh does)
        run: |
          $out = 'target/release'
          New-Item -ItemType Directory -Force ../../dist | Out-Null
          Compress-Archive -Force -Path "$out/veylo-dx.exe", "$out/libmpv-2.dll", "$out/picks-ai" -DestinationPath ../../dist/veylo-windows-x64.zip
          Get-Item ../../dist/veylo-windows-x64.zip | Select-Object Name, Length
      - name: Install with install.ps1
        working-directory: .
        run: |
          $env:VEYLO_ZIP = (Resolve-Path dist/veylo-windows-x64.zip).Path
          $env:VEYLO_NO_LAUNCH = '1'
          ./install.ps1
      - name: Self-test the installed copy
        working-directory: .
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Veylo\veylo-dx.exe'
          $report = Join-Path $env:RUNNER_TEMP 'self-test.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test', '--online', '--report', $report -Wait -PassThru -NoNewWindow
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit $($p.ExitCode))" }
      - name: Launch check
        working-directory: .
        run: ./tools/ci/launch-check.ps1 -Exe (Join-Path $env:LOCALAPPDATA 'Programs\Veylo\veylo-dx.exe') -Shot screenshots/windows-home.png
      - name: Picture test, colour bars on screen
        working-directory: .
        run: ./tools/ci/launch-check.ps1 -Exe (Join-Path $env:LOCALAPPDATA 'Programs\Veylo\veylo-dx.exe') -Shot screenshots/windows-bars.png -Seconds 30 -Bars
      # Plays a stream from the web on a runner without a GPU (Direct3D 11 on WARP): informative only.
      - name: Launch check, playing the test stream
        continue-on-error: true
        working-directory: .
        run: ./tools/ci/launch-check.ps1 -Exe (Join-Path $env:LOCALAPPDATA 'Programs\Veylo\veylo-dx.exe') -Shot screenshots/windows-player.png -Seconds 30 -Demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-windows
          path: screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: veylo-windows-x64
          path: dist/veylo-windows-x64.zip

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    defaults:
      run:
        working-directory: apps/veylo-dx
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: brew install mpv dylibbundler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/veylo-dx -> target
      - uses: actions/cache@v4
        with:
          path: apps/veylo-dx/picks-ai/downloads
          key: picks-ai-downloads-${{ hashFiles('tools/picks-ai/pins.json') }}
      - run: python3 ../../tools/picks-ai/fetch.py macos-arm64
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # crates/video-surface's tests (path order, fallback memory) run on Linux: on its own it doesn't
      # link this OS's libmpv, which only the app's build script finds. Clippy still checks it here.
      - run: cargo test --locked --workspace --exclude veylo-video-surface
      - name: Build Veylo.app (fails if it still needs Homebrew)
        run: ../../tools/build-macos.sh
      - name: Install with install.sh
        working-directory: .
        run: VEYLO_ZIP=dist/veylo-macos-arm64.zip VEYLO_NO_LAUNCH=1 sh install.sh
      - name: Self-test the installed copy
        run: /Applications/Veylo.app/Contents/MacOS/veylo-dx --self-test --online
      - name: Launch check
        working-directory: .
        run: tools/ci/launch-check.sh /Applications/Veylo.app/Contents/MacOS/veylo-dx screenshots/macos-home.png
      - name: Picture test, colour bars on screen
        working-directory: .
        run: tools/ci/launch-check.sh /Applications/Veylo.app/Contents/MacOS/veylo-dx screenshots/macos-bars.png 30 --bars
      # Plays a stream from the web on a VM without a real GPU (basic OpenGL): informative only.
      - name: Launch check, playing the test stream
        continue-on-error: true
        working-directory: .
        run: tools/ci/launch-check.sh /Applications/Veylo.app/Contents/MacOS/veylo-dx screenshots/macos-player.png 30 --demo
      # HDR through the window: the HDR10 clip on a pretend EDR screen (VEYLO_DX_EDR; the runner's
      # display is SDR): the layer must switch to PQ and keep drawing.
      - name: Launch check, HDR10 through the video layer
        working-directory: .
        env:
          VEYLO_DX_PLAY_DEMO: hdr
          VEYLO_DX_EDR: "4"
          VEYLO_EXPECT_LOG: "HDR output on: PQ bt.2020"
        run: tools/ci/launch-check.sh /Applications/Veylo.app/Contents/MacOS/veylo-dx screenshots/macos-hdr.png 20
      - name: Crash reports
        if: always()
        working-directory: .
        run: |
          mkdir -p screenshots
          for f in ~/Library/Logs/DiagnosticReports/veylo*; do [ -f "$f" ] && cp "$f" screenshots/ && head -c 12000 "$f"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-macos
          path: screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: veylo-macos-arm64
          path: dist/veylo-macos-arm64.zip
