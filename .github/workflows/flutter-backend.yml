name: flutter-backend-smoke
# Headless check of the Flutter app's Rust bridge on every desktop OS: builds it, runs its unit
# tests (incl. the Sentry redaction tests) and the network smoke test that drives real backend
# ops (search, title details/extras, sources, diagnostics) against a throwaway data folder, so
# backend runtime errors and panics show up here instead of in the app. No UI, no tokens.
on:
  push:
    paths: ["apps/veylo-flutter/rust/**", "apps/veylo-dx/src/**", "crates/**", ".github/workflows/flutter-backend.yml"]
  pull_request:
    paths: ["apps/veylo-flutter/rust/**", "apps/veylo-dx/src/**", "crates/**", ".github/workflows/flutter-backend.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/veylo-flutter/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/veylo-flutter/rust -> target
      # Picks AI needs the bundled ONNX Runtime, which the bridge tests don't ship: skip those two.
      - name: Unit tests
        run: cargo test --release --locked -- --skip picks_ai::tests::bundled_model --skip picks_ai::tests::long_synopses
      - name: Backend smoke test (network)
        run: cargo test --release --locked -- --ignored smoke --nocapture
