[workspace]
members = ["."]

[package]
name = "veylo_bridge"
version = "0.13.7"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rustmedia-core = { path = "../../../crates/core" }
rustmedia-media-proxy = { path = "../../../crates/media-proxy" }
anyhow = "1"
base64 = "0.22"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
regex = "1"
# http2: ALPN-negotiated HTTP/2, so concurrent requests to one host share a connection.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
ring = "0.17"
serde_json = "1"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "logs", "debug-images"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
unicode-normalization = "0.1"
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[profile.release]
# Line tables only: Sentry/backtraces show file:line for panics without full debug info.
debug = "line-tables-only"

# Dependencies carry no debug info (keeps the .so small); only Veylo's own code gets line tables.
[profile.release.package."*"]
debug = false
