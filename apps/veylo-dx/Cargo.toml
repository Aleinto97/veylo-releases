# Dioxus prototype of the Veylo shell (Search and Picks), all Rust + CSS.
# Deliberately its own workspace: it must not touch the Android workspace's
# manifest or Cargo.lock, which the APK packaging guard watches.
[workspace]

[package]
name = "veylo-dx"
version = "0.7.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
getrandom = "0.3"
dioxus = { version = "0.7.10", features = ["desktop"] }
rustmedia-core = { path = "../../crates/core" }
# The same one-byte source check the Android app uses before Play (debrid clips, header scoping).
rustmedia-media-proxy = { path = "../../crates/media-proxy" }
regex = "1"
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
unicode-normalization = "0.1"
# CPU inference on Linux, Windows and Android; runtime shipped beside the app.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
sha2 = "0.10"
url = "2"
# The player on every platform: libmpv driven from Rust (src/engine.rs). Android links the
# mpv-android build in android/mpv (android/fetch-mpv.sh); desktop the system libmpv.
libmpv2 = { version = "7.0.1", default-features = false }
libmpv2-sys = "4.0.1"
libc = "0.2"

[build-dependencies]
# Windows: the app icon inside veylo-dx.exe (windows/veylo.rc); a no-op for other targets.
embed-resource = "3"

# Windows: the screen's HDR state and peak luminance (src/display.rs), the same windows crate wry uses.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

# Linux: the GL area under the WebView that mpv renders into (src/video.rs); the same gtk as wry's.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Wayland: the picture on its own subsurface under the window (src/video.rs), on GTK's connection.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-egl = "0.32"

# macOS: the picture under the WebView, drawn by mpv's render API into a Core Animation OpenGL layer
# (src/video.rs), and the screen's EDR (HDR) headroom (src/display.rs); the same objc2 crates wry uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSScreen", "NSGraphics", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAOpenGLLayer", "CATransaction", "objc2-open-gl", "objc2-core-graphics", "objc2-core-video", "objc2-core-foundation"] }
objc2-open-gl = { version = "0.3.2", default-features = false, features = ["std", "CGLTypes", "CGLCurrent", "CGLRenderers"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor", "CGColorSpace"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }

# Android: JNI for the files folder and the Media3 player activity (android/kotlin).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"
