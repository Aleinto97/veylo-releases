# Veylo, the all-Rust Dioxus app (Android, Linux, Windows, macOS): Rust + CSS on the shared core.
# Deliberately its own workspace: it must not touch the Android workspace's
# manifest or Cargo.lock, which the APK packaging guard watches.
# Its two crates live in crates/ beside the shared ones but belong to this workspace.
[workspace]
members = [".", "../../crates/video-surface", "../../crates/picture-check"]

[package]
name = "veylo-dx"
version = "0.10.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
getrandom = "0.3"
dioxus = { version = "0.7.10", features = ["desktop"] }
rustmedia-core = { path = "../../crates/core" }
# The same one-byte source check the Android app uses before Play (debrid clips, header scoping).
rustmedia-media-proxy = { path = "../../crates/media-proxy" }
regex = "1"
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
unicode-normalization = "0.1"
# CPU inference on Linux, Windows and Android; runtime shipped beside the app.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
sha2 = "0.10"
# Accounts: the link a phone hands a computer is sealed (AES-256-GCM); the computer shows it as a QR code.
ring = "0.17"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
url = "2"
# The player on every platform: libmpv driven from Rust (src/engine.rs). Android links the
# mpv-android build in android/mpv (android/fetch-mpv.sh); desktop the system libmpv.
libmpv2 = { version = "7.0.1", default-features = false }
libmpv2-sys = "4.0.1"
libc = "0.2"
# The clip of known colour bars and the check that a screenshot shows it (CI's picture test).
veylo-picture-check = { path = "../../crates/picture-check" }

[build-dependencies]
# Windows: the app icon inside veylo-dx.exe (windows/veylo.rc); a no-op for other targets.
embed-resource = "3"

# Windows: the screen's HDR state and peak luminance (src/display.rs), the same windows crate wry uses.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

# Desktop: the picture under the WebView, one path per OS (crates/video-surface, used by src/video.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
veylo-video-surface = { path = "../../crates/video-surface" }

# Linux: the GTK window and web view handed to the picture's crate; the same gtk as wry's.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Android: JNI for the files folder and the Media3 player activity (android/kotlin).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"
