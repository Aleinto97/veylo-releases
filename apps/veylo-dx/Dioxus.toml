[application]
name = "veylo-dx"

[bundle]
identifier = "dev.veylo.dx"
publisher = "Veylo"

[android]
min_sdk = 26
compile_sdk = 36
target_sdk = 35
# dx 0.7.10 compiles Kotlin 2.0.20, which can't read a Kotlin 2.2 stdlib: pin the stdlib strictly.
gradle_dependencies = [
    "org.jetbrains.kotlin:kotlin-stdlib:2.0.21!!",
    # Account sign-in (android/kotlin/VeyloAccount.kt): Google through Android's account sheet, and
    # Google's QR scanner for a computer's sign-in code (no camera permission needed).
    "androidx.credentials:credentials:1.3.0",
    "androidx.credentials:credentials-play-services-auth:1.3.0",
    "com.google.android.libraries.identity.googleid:googleid:1.1.1",
    "com.google.android.gms:play-services-code-scanner:16.1.0",
]

# Updates: Veylo installs a downloaded release through PackageInstaller (android/kotlin/VeyloUpdate.kt).
[android.raw]
manifest = """<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />"""

