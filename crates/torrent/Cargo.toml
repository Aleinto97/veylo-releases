[package]
name = "stremio-torrent"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
anyhow = "1"
fs2 = "0.4"
hex = "0.4"
librqbit = { version = "=8.1.1", default-features = false, features = ["rust-tls"] }
mime_guess = "2"
rand = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "net", "io-util", "time", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
