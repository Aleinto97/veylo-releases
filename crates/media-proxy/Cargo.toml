[package]
name = "rustmedia-media-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
anyhow = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "macros", "sync", "time", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
quick-xml = "0.41"
